<div class="min-h-screen bg-white dark:bg-gray-950 flex items-center justify-center p-6">
  <div class="w-full max-w-md">
    <a routerLink="/" class="block text-center text-3xl font-black text-[#005943] dark:text-emerald-400 mb-8">DineAhead</a>

    <h2 class="text-3xl font-extrabold text-gray-900 dark:text-white mb-2">Set your new password</h2>
    <p class="text-gray-500 dark:text-gray-400 mb-8">Enter your new password below.</p>

    @if (successMessage) {
      <div class="bg-green-50 border border-green-200 text-green-700 text-sm font-bold px-4 py-3 rounded-xl mb-4">
        {{ successMessage }}
      </div>
    }

    <form (ngSubmit)="submitReset()" class="space-y-5">
      <div>
        <label class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-2">New Password</label>
        <input type="password" [(ngModel)]="newPassword" name="newPassword" required
               placeholder="At least 8 characters"
               class="w-full px-4 py-3 bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl text-sm font-medium placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-[#005943]" />
        <p class="mt-2 text-xs text-gray-500">
          Must be at least 8 chars, include 1 uppercase, 1 lowercase, and 1 special char.
        </p>
      </div>

      <div>
        <label class="block text-sm font-bold text-gray-700 dark:text-gray-300 mb-2">Confirm Password</label>
        <input type="password" [(ngModel)]="confirmPassword" name="confirmPassword" required
               placeholder="Confirm your password"
               class="w-full px-4 py-3 bg-gray-50 dark:bg-gray-900 border border-gray-200 dark:border-gray-700 rounded-xl text-sm font-medium placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-[#005943]" />
      </div>

      @if (errorMessage) {
        <div class="bg-red-50 border border-red-200 text-red-700 text-xs font-bold px-4 py-3 rounded-xl">
          {{ errorMessage }}
        </div>
      }

      <button type="submit" [disabled]="isLoading"
              class="w-full py-3.5 bg-[#005943] hover:bg-[#004735] disabled:opacity-70 text-white font-extrabold text-sm rounded-xl transition shadow-lg active:scale-95 uppercase tracking-wider">
        @if (isLoading) {
          <span class="flex items-center justify-center gap-2">
            <svg class="animate-spin h-4 w-4 text-white" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
            Resetting...
          </span>
        } @else {
          Reset Password
        }
      </button>

      <p class="text-center text-sm text-gray-500 dark:text-gray-400 mt-4">
        Remembered your password? <a routerLink="/login" class="font-bold text-[#005943] dark:text-emerald-400 hover:underline">Log In</a>
      </p>
    </form>
  </div>
</div>
