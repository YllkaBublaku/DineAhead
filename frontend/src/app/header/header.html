
<header class="bg-white dark:bg-gray-900 border-b border-gray-100 dark:border-gray-800 sticky top-0 z-50 transition-colors duration-200 shadow-xs">
  <div class="w-full max-w-[1720px] mx-auto px-4 sm:px-6 lg:px-8 h-16 sm:h-20 flex items-center justify-between gap-4">

    <a routerLink="/" class="text-2xl sm:text-[28px] font-black tracking-tight text-[#005943] dark:text-emerald-400 select-none whitespace-nowrap hover:opacity-90 transition-opacity shrink-0">
      DineAhead
    </a>

    @if (showSearch) {
      <div class="hidden md:flex items-center flex-1 max-w-2xl bg-gray-50 dark:bg-gray-800 border border-gray-200 dark:border-gray-700 rounded-full p-1.5 shadow-xs">
        <div class="flex items-center gap-2 px-3 py-1 flex-1 min-w-0">
          <svg class="w-4 h-4 text-gray-500 shrink-0" fill="currentColor" viewBox="0 0 20 20">
            <path fill-rule="evenodd" d="M5.05 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z" clip-rule="evenodd"></path>
          </svg>
          <input type="text"
                 [(ngModel)]="searchCity"
                 placeholder="City or neighborhood"
                 class="w-full text-xs sm:text-sm font-semibold text-gray-900 dark:text-white bg-transparent focus:outline-none placeholder-gray-400">
        </div>

        <div class="h-5 w-px bg-gray-300 dark:bg-gray-600 shrink-0"></div>

        <div class="flex items-center gap-2 px-3 py-1 flex-[1.4] min-w-0">
          <svg class="w-4 h-4 text-gray-400 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
          </svg>
          <input type="text"
                 [(ngModel)]="searchQuery"
                 (keyup.enter)="onSearch()"
                 placeholder="Cuisine, restaurant name..."
                 class="w-full text-xs sm:text-sm italic text-gray-800 dark:text-gray-100 bg-transparent focus:outline-none placeholder-gray-400">
        </div>

        <button (click)="onSearch()"
                class="bg-[#005943] hover:bg-[#004735] text-white text-xs font-bold uppercase tracking-wider px-5 py-2 rounded-full transition shadow-xs shrink-0 active:scale-95">
          Search
        </button>
      </div>
    } @else {
      <nav class="hidden lg:flex items-center gap-8 text-sm font-semibold text-gray-700 dark:text-gray-300">
        <a routerLink="/restaurants" class="hover:text-[#005943] dark:hover:text-emerald-400 transition-colors">Restaurants</a>
        <a routerLink="/offers" class="hover:text-[#005943] dark:hover:text-emerald-400 transition-colors">Offers</a>
        <a routerLink="/how-it-works" class="hover:text-[#005943] dark:hover:text-emerald-400 transition-colors">How it works</a>
        <a routerLink="/help" class="hover:text-[#005943] dark:hover:text-emerald-400 transition-colors">Help</a>
      </nav>
    }

    <div class="flex items-center gap-3 sm:gap-4 shrink-0">
      <button (click)="toggleDarkMode()"
              aria-label="Toggle dark mode"
              class="p-2 rounded-full text-gray-600 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 transition">
        <svg class="w-5 h-5 dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"></path>
        </svg>
        <svg class="w-5 h-5 hidden dark:inline" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"></path>
        </svg>
      </button>

      @if (showSearch) {
        <div class="hidden lg:flex items-center gap-3 text-xs font-semibold text-gray-600 dark:text-gray-300">
          <a routerLink="/partner" class="hover:text-[#005943] dark:hover:text-emerald-400 transition underline-offset-2 hover:underline">For restaurants</a>
          <span class="text-gray-300 dark:text-gray-700">|</span>
          <a routerLink="/help" class="hover:text-[#005943] dark:hover:text-emerald-400 transition underline-offset-2 hover:underline">Help</a>
        </div>
      } @else {
        <a routerLink="/signup"
           class="hidden sm:inline-flex items-center px-4 py-2 text-xs sm:text-sm font-bold text-gray-700 dark:text-gray-200 hover:text-[#005943] dark:hover:text-emerald-400 transition uppercase tracking-wider">
          Sign Up
        </a>
      }

      <a routerLink="/login"
         class="inline-flex items-center gap-1.5 px-4 sm:px-5 py-2.5 text-xs sm:text-sm font-bold uppercase tracking-wider bg-[#005943] hover:bg-[#004735] text-white rounded-lg transition shadow-xs active:scale-95">
        <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
        </svg>
        <span>Log In</span>
      </a>

      <button (click)="toggleMobileMenu()"
              class="lg:hidden p-2 text-gray-700 dark:text-gray-300 hover:bg-gray-100 dark:hover:bg-gray-800 rounded-lg transition"
              aria-label="Open mobile menu">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
      </button>
    </div>
  </div>

  <div class="lg:hidden border-t border-gray-100 dark:border-gray-800 bg-white dark:bg-gray-900" [class.hidden]="!mobileMenuOpen">
    <div class="w-full max-w-[1720px] mx-auto px-4 py-4 flex flex-col gap-3 text-sm font-semibold">
      <a routerLink="/restaurants" (click)="closeMobileMenu()" class="text-gray-800 dark:text-gray-200 py-2 hover:text-[#005943]">Restaurants</a>
      <a routerLink="/offers" (click)="closeMobileMenu()" class="text-gray-800 dark:text-gray-200 py-2 hover:text-[#005943]">Offers</a>
      <a routerLink="/how-it-works" (click)="closeMobileMenu()" class="text-gray-800 dark:text-gray-200 py-2 hover:text-[#005943]">How it works</a>
      <a routerLink="/help-page" (click)="closeMobileMenu()" class="text-gray-800 dark:text-gray-200 py-2 hover:text-[#005943]">Help</a>
      <div class="pt-2 border-t border-gray-200 dark:border-gray-800 flex gap-3">
        <a routerLink="/signup" (click)="closeMobileMenu()" class="flex-1 text-center py-2 text-sm font-bold border border-gray-300 dark:border-gray-700 rounded-md">Sign Up</a>
        <a routerLink="/login" (click)="closeMobileMenu()" class="flex-1 text-center py-2 text-sm font-bold bg-[#005943] text-white rounded-md">Log In</a>
      </div>
    </div>
  </div>
</header>
