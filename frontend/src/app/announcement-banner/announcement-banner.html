@if (type !== 'off' && message) {
  <div class="w-full px-4 py-2.5 text-sm font-bold flex items-center justify-center gap-3"
       [ngClass]="bannerClass">
    <svg class="w-4 h-4 shrink-0" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
      @if (type === 'warning') {
        <path stroke-linecap="round" stroke-linejoin="round"
              d="M12 9v2m0 4h.01M5.07 19H18.93a2 2 0 001.72-3.03l-6.93-12a2 2 0 00-3.44 0l-6.93 12A2 2 0 005.07 19z"/>
      } @else {
        <path stroke-linecap="round" stroke-linejoin="round"
              d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
      }
    </svg>
    <span>{{ message }}</span>
  </div>
}
